<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #bfe3fa; }
  body { font-family: "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; background-color: #bfe3fa; }
  a { color: #0b6fe0; text-decoration: none; }
  a:hover { color: #0954ad; }
  .lp-body { position: relative; z-index: 1; }
  @media (min-width: 431px) { .lp-body { box-shadow: 0 0 60px rgba(20,70,140,0.22); } }
  @media (max-width: 430px) { html, body { background: #ffffff; } #raybg { display: none; } }
</style>
<script>
(function(){
  var el=null, ticking=false, cur=0, target=0;
  function loop(){
    el = el || document.getElementById('raybg');
    target = (window.scrollY||window.pageYOffset||0) * 0.006;
    cur += (target - cur) * 0.08;
    if(el){ el.style.transform = 'rotate('+cur.toFixed(3)+'deg)'; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</helmet>
<div id="raybg" aria-hidden="true" style="position: fixed; top: -50vh; left: -50vw; width: 200vw; height: 200vh; z-index: 0; pointer-events: none; transform-origin: center center; will-change: transform; background: radial-gradient(ellipse 55% 48% at 50% 68%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.12) 45%, rgba(255,255,255,0) 66%), repeating-conic-gradient(from 174deg at 50% 70%, #cbe8fb 0deg 6deg, #b1dbf6 6deg 12deg);"></div>
